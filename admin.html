<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>管理画面 - 学習データ管理</title>
  <script src="./assets/logger.js"></script>
  <style>
    body { font-family: "Helvetica Neue", Arial, sans-serif; background: #e5f0fc; padding: 40px; color: #424b54; }
    .admin-card { background: white; max-width: 500px; margin: 0 auto; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    h1 { border-bottom: 2px solid #f1f2f6; padding-bottom: 15px; font-size: 1.4rem; text-align: center; }
    .stat-box { background: #f8f9fa; border: 1px solid #dfe6e9; padding: 20px; border-radius: 8px; margin: 20px 0; text-align: center; }
    .count-number { display: block; font-size: 2rem; font-weight: bold; color: #0984e3; }
    
    .btn { display: block; width: 100%; padding: 15px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1rem; margin-bottom: 12px; transition: 0.2s; }
    .btn-csv { background: #2ecc71; color: white; }
    .btn-csv:hover { background: #27ae60; }
    .btn-danger { background: #dfe6e9; color: #636e72; font-size: 0.85rem; }
    .btn-danger:hover { background: #fab1a0; color: #d63031; }
    
    .back-link { display: block; margin-top: 25px; text-align: center; color: #0984e3; text-decoration: none; font-size: 0.9rem; }
    .back-link:hover { text-decoration: underline; }
  </style>
</head>
<body>

<div class="admin-card">
  <h1>学習データ管理</h1>
  
  <div class="stat-box">
    <span>現在の蓄積ログ件数</span>
    <strong class="count-number" id="logCount">0</strong>
  </div>

  <button class="btn btn-csv" onclick="SecLogger.exportCSV()">📊 ログをCSV形式で保存</button>

  <button class="btn btn-csv" style="background:#0984e3" onclick="location.href='report.html'">📋 レポートを見る（結果＋アンケ）</button>

  <div style="margin-top: 40px; border-top: 1px dashed #ccc; padding-top: 20px;">
    <p style="font-size: 0.8rem; color: #b2bec3; margin-bottom: 10px;">メンテナンス操作</p>
    <button class="btn btn-danger" onclick="handleClearLogs()">ログのみ消去</button>
    <button class="btn btn-danger" onclick="handleResetAll()">全データをリセット</button>
  </div>

  <a href="index.html" class="back-link">← ホーム画面に戻る</a>
</div>

<script>
  function updateCount() {
    try {
      const events = JSON.parse(localStorage.getItem("sec_learn_events") || "[]");
      document.getElementById("logCount").textContent = events.length;
    } catch(e) { console.error(e); }
  }

  function handleClearLogs() {
    if(confirm("保存されているログを消去しますか？")) {
      if(window.SecLogger) SecLogger.clearLogs();
      updateCount();
    }
  }

  function handleResetAll() {
    if(confirm("すべての学習データと設定を完全に消去しますか？")) {
      localStorage.clear();
      location.href = "index.html";
    }
  }

  updateCount();
</script>
</body>
</html>
