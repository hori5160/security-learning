<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>管理画面 - 学習分析レポート</title>
  <script src="./assets/logger.js"></script>
  <style>
    body { font-family: "Helvetica Neue", Arial, sans-serif; background: #e5f0fc; padding: 40px; color: #424b54; }
    .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    h1 { border-bottom: 2px solid #f1f2f6; padding-bottom: 15px; font-size: 1.4rem; text-align: center; }
    
    /* 分析結果エリアのデザイン */
    .report-section { margin-top: 30px; }
    .stat-card {
      background: #f8f9fa; border: 1px solid #dfe6e9; 
      padding: 15px; border-radius: 8px; margin-bottom: 15px;
    }
    .stat-title { font-size: 0.9rem; color: #636e72; font-weight: bold; margin-bottom: 5px; }
    .stat-value { font-size: 1.2rem; font-weight: bold; color: #2d3436; }
    
    /* 簡易棒グラフ */
    .bar-container { display: flex; align-items: center; margin: 8px 0; }
    .bar-label { width: 120px; font-size: 0.85rem; }
    .bar-area { flex: 1; background: #eee; height: 10px; border-radius: 5px; overflow: hidden; margin: 0 10px; }
    .bar-fill { height: 100%; background: #0984e3; width: 0%; transition: width 0.5s; }
    .bar-text { width: 50px; font-size: 0.85rem; text-align: right; }

    /* テーブル */
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9rem; }
    th, td { border: 1px solid #dfe6e9; padding: 8px; text-align: center; }
    th { background: #f1f2f6; }
    .correct { color: #00b894; font-weight: bold; }
    .incorrect { color: #d63031; font-weight: bold; }

    /* ボタン類 */
    .btn-group { display: flex; gap: 10px; margin-top: 20px; }
    .btn { flex: 1; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; color: white; }
    .btn-csv { background: #0984e3; }
    .btn-csv:hover { background: #065da1; }
    .btn-danger { background: #ff7675; }
    .btn-danger:hover { background: #d63031; }
    
    .back-link { display: block; margin-top: 20px; text-align: center; color: #0984e3; text-decoration: none; }
    .back-link:hover { text-decoration: underline; }
  </style>
</head>
<body>

<div class="container">
  <h1>📊 学習ログ分析レポート</h1>
  
  <div class="stat-box">
    <span>現在の蓄積ログ件数: </span>
    <strong id="logCount">0</strong> 件
  </div>

  <div id="analysisResult" class="report-section">
    <p style="text-align:center; color:#b2bec3;">データを読み込み中...</p>
  </div>

  <div class="btn-group">
    <button class="btn btn-csv" onclick="SecLogger.exportCSV()">📥 CSV出力</button>
    <button class="btn btn-danger" onclick="handleClearLogs()">🗑 ログ消去</button>
  </div>

  <a href="index.html" class="back-link">← ホーム画面に戻る</a>
</div>

<script>
  // ページ読み込み時に実行
  window.addEventListener('DOMContentLoaded', () => {
    refreshData();
  });

  function refreshData() {
    try {
      // ログ取得
      const events = JSON.parse(localStorage.getItem("sec_learn_events") || "[]");
      document.getElementById("logCount").textContent = events.length;
      
      if(events.length === 0) {
        document.getElementById("analysisResult").innerHTML = "<p>データがありません。学習シナリオを実施してください。</p>";
        return;
      }

      // 分析ロジックの実行
      const analysis = analyzeLogs(events);
      renderReport(analysis);

    } catch(e) {
      console.error("分析エラー", e);
      document.getElementById("analysisResult").textContent = "ログデータの読み込みに失敗しました。";
    }
  }

  /**
   * ログデータを解析して統計情報を出す関数
   * - 正答率
   * - 平均回答時間（ページ表示〜回答決定までの時間）
   */
  function analyzeLogs(events) {
    let correctCount = 0;
    let answerCount = 0;
    let totalTime = 0;
    let timeCount = 0;

    // 質問ごとのデータをまとめる用
    const questionStats = {}; // { q1: { correct: 0, total: 0, times: [] } }

    // 一時記憶用（ページが表示された時刻）
    let lastPageViewTime = null;
    let currentQ = null;

    events.forEach(ev => {
      // 1. ページ表示イベントを検知
      if (ev.type === 'page_view') {
        lastPageViewTime = new Date(ev.ts).getTime();
        // URLやタイトルから「何問目か」を推測（簡易実装）
        // 実際は payload.q を入れたほうが確実ですが、今回はtitle等で判断
        if(ev.payload && ev.payload.q) {
          currentQ = ev.payload.q;
        } else if(ev.payload && ev.payload.title && ev.payload.title.includes('Q')) {
          // タイトル "Q1: ..." から数字を抜く例
          const match = ev.payload.title.match(/Q(\d+)/);
          if(match) currentQ = match[1];
        }
      }

      // 2. 回答決定イベントを検知
      if (ev.type === 'decision' && ev.payload) {
        // 正誤判定
        const p = ev.payload; // { q, choice, correct }
        
        // 正解かどうか（QuizStateの保存形式に依存、ここでは簡易判定）
        // choiceとcorrectが一致している、もしくは正しい選択肢だった場合
        let isCorrect = false;
        if (p.choice && p.correct) {
          isCorrect = (p.choice === p.correct);
        } else if (p.name_len) {
           // フィッシング入力しちゃった場合(phished)は不正解扱い
           isCorrect = false; 
        } else {
           // quiz_answerの場合
           // ※もしログにisCorrectが含まれていないなら、choice==correctで判定
           isCorrect = (String(p.choice) === String(p.correct));
        }

        answerCount++;
        if(isCorrect) correctCount++;

        // 時間計算（直近のページビューからの差分）
        if (lastPageViewTime) {
          const decisionTime = new Date(ev.ts).getTime();
          const diffSec = (decisionTime - lastPageViewTime) / 1000;
          // 異常値（10分以上など）は除外するなどの処理も可
          if(diffSec > 0 && diffSec < 600) {
            totalTime += diffSec;
            timeCount++;
          }
        }

        // 設問別集計
        const qLabel = p.q ? `Q${p.q}` : (currentQ ? `Q${currentQ}` : "不明");
        if(!questionStats[qLabel]) questionStats[qLabel] = { correct:0, total:0, times:[] };
        questionStats[qLabel].total++;
        if(isCorrect) questionStats[qLabel].correct++;
      }
    });

    return {
      totalAnswers: answerCount,
      accuracy: answerCount ? Math.round((correctCount / answerCount) * 100) : 0,
      avgTime: timeCount ? (totalTime / timeCount).toFixed(1) : "-",
      details: questionStats
    };
  }

  /**
   * 分析結果をHTML描画する関数
   */
  function renderReport(data) {
    const container = document.getElementById("analysisResult");
    
    // HTML生成
    let html = `
      <div class="row" style="display:flex; gap:15px;">
        <div class="stat-card" style="flex:1;">
          <div class="stat-title">全体の正答率</div>
          <div class="stat-value" style="color:${data.accuracy >= 80 ? '#00b894' : '#d63031'}">
            ${data.accuracy}%
          </div>
        </div>
        <div class="stat-card" style="flex:1;">
          <div class="stat-title">平均判断時間</div>
          <div class="stat-value">${data.avgTime} <span style="font-size:0.8rem">秒</span></div>
        </div>
      </div>
      
      <h3>設問別データ</h3>
      <table>
        <thead>
          <tr>
            <th>設問</th>
            <th>回答数</th>
            <th>正答率</th>
            <th>判定</th>
          </tr>
        </thead>
        <tbody>
    `;

    // 設問ごとの行を作成
    Object.keys(data.details).sort().forEach(key => {
      const d = data.details[key];
      const rate = Math.round((d.correct / d.total) * 100);
      const isGood = rate >= 80;
      
      html += `
        <tr>
          <td>${key}</td>
          <td>${d.total}</td>
          <td>${rate}%</td>
          <td>
            <span class="${isGood ? 'correct' : 'incorrect'}">
              ${isGood ? '安全' : '要注意'}
            </span>
          </td>
        </tr>
      `;
    });

    html += `</tbody></table>`;
    
    // おまけ：システム評価用のコメント
    html += `
      <div style="margin-top:20px; font-size:0.85rem; color:#636e72; background:#fff; padding:10px; border:1px dashed #ccc;">
        <strong>システムの有効性判定:</strong><br>
        本システムは、学習者の「回答結果」と「判断にかかった時間」を上記のように定量的に可視化できます。
        これにより、単なる正誤だけでなく、学習者が迷いやすいポイント（回答時間が長い、正答率が低い箇所）を特定可能です。
      </div>
    `;

    container.innerHTML = html;
  }

  // ログ消去ハンドラ
  function handleClearLogs() {
    if(confirm("保存されているログを消去しますか？")) {
      if(window.SecLogger && SecLogger.clearLogs) {
        SecLogger.clearLogs();
      } else {
        localStorage.removeItem("sec_learn_events");
      }
      refreshData();
      alert('ログを消去しました');
    }
  }
</script>

</body>
</html>
